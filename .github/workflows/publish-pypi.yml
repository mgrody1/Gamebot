
name: Publish to PyPI and TestPyPI

on:
  push:
    tags:
      - 'code-v*'
  # Tags pushed with GITHUB_TOKEN (manual-tag.yml) don't fire the push trigger,
  # so that workflow dispatches this one on the tag ref instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-testpypi:
    if: startsWith(github.ref, 'refs/tags/code-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: gamebot-lite-test
      url: https://test.pypi.org/project/gamebot-lite/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "code-v${version}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version} (expected code-v${version})"
            exit 1
          fi
          echo "Tag matches version ${version}"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify data files exist
        run: |
          if [ ! -f "gamebot_lite/data/gamebot.sqlite" ]; then
            echo "ERROR: SQLite database not found"
            exit 1
          fi
          if [ ! -f "gamebot_lite/data/manifest.json" ]; then
            echo "ERROR: Manifest not found"
            exit 1
          fi
          echo "Data files verified"

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Install test dependencies
        run: |
          pip install .[duckdb]
          pip install pytest

      - name: Run smoke tests
        run: pytest tests -v

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

      - name: Wait for TestPyPI propagation
        run: sleep 60

      - name: Test install from TestPyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ --no-deps gamebot-lite
          python -c "import gamebot_lite; print(f'Installed successfully')"

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
      id-token: write
    environment:
      name: gamebot-lite-prod
      url: https://pypi.org/project/gamebot-lite/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify data files exist
        run: |
          if [ ! -f "gamebot_lite/data/gamebot.sqlite" ]; then
            echo "ERROR: SQLite database not found"
            exit 1
          fi
          if [ ! -f "gamebot_lite/data/manifest.json" ]; then
            echo "ERROR: Manifest not found"
            exit 1
          fi
          echo "Data files verified"

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Install test dependencies
        run: |
          pip install .[duckdb]
          pip install pytest

      - name: Run smoke tests
        run: pytest tests -v

      - name: Publish to Production PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create job summary
        if: always()
        run: |
          echo "## PyPI Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "gamebot_lite/data/manifest.json" ]; then
            echo "### Data Package Manifest" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat gamebot_lite/data/manifest.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
