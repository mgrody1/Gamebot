name: Manual Release Tag

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Release type"
        required: true
        default: data
        type: choice
        options:
          - data
          - code
      date:
        description: "Date for data release (YYYYMMDD). Leave blank for today."
        required: false
      version:
        description: "Version for code release (vX.Y.Z). Required for code releases."
        required: false
      push_tag:
        description: "Push tag to origin"
        required: false
        default: true
        type: boolean

permissions:
  contents: write  # push the tag
  actions: write   # dispatch the tag's release workflow

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create tag
        id: tag
        env:
          RELEASE_TYPE: ${{ inputs.type }}
          RELEASE_DATE: ${{ inputs.date }}
          RELEASE_VERSION: ${{ inputs.version }}
          PUSH_TAG: ${{ inputs.push_tag }}
        run: |
          args=("$RELEASE_TYPE")
          if [ "$RELEASE_TYPE" = "data" ]; then
            RELEASE_DATE="${RELEASE_DATE:-$(date -u +%Y%m%d)}"
            if ! [[ "$RELEASE_DATE" =~ ^[0-9]{8}$ ]]; then
              echo "Date must be YYYYMMDD, got '$RELEASE_DATE'" >&2
              exit 1
            fi
            args+=("--date" "$RELEASE_DATE")
            echo "name=data-$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$RELEASE_VERSION" ]; then
              echo "Version is required for code releases" >&2
              exit 1
            fi
            if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version must be vX.Y.Z, got '$RELEASE_VERSION'" >&2
              exit 1
            fi
            args+=("--version" "$RELEASE_VERSION")
            echo "name=code-$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PUSH_TAG" != "true" ]; then
            args+=("--no-push")
          fi
          python scripts/tag_release.py "${args[@]}"
      # A tag pushed with GITHUB_TOKEN doesn't fire other workflows' push
      # triggers, so start the tag's release workflow on it explicitly.
      - name: Dispatch release workflow
        if: inputs.push_tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.type }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if [ "$RELEASE_TYPE" = "code" ]; then
            gh workflow run publish-pypi.yml --ref "$TAG"
          else
            gh workflow run post-data-release.yml --ref "$TAG"
          fi
