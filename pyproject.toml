[project]
name = "gamebot-lite"
version = "0.2.2"
description = "Lightweight Survivor data snapshot (SQLite)"
authors = [
  { name = "Gamebot Team" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pandas",
]

[project.optional-dependencies]
duckdb = ["duckdb"]

[project.urls]
Homepage = "https://github.com/mgrody1/Gamebot"
Repository = "https://github.com/mgrody1/Gamebot"
Issues = "https://github.com/mgrody1/Gamebot/issues"
Documentation = "https://github.com/mgrody1/Gamebot/blob/main/docs/analyst_guide.md"

# Development environment. `uv sync` installs the default groups.
[dependency-groups]
pipeline = [
    "pandas>=1.5.0,<3.0",
    "numpy>=1.20.0,<2.0",
    "SQLAlchemy>=1.4.0,<3.0",
    "python-dotenv>=0.19.0,<2.0",
    "requests>=2.25.0,<3.0",
    "pyreadr>=0.4.0,<1.0",
    "dbt-core==1.9.1",
    "dbt-postgres==1.9.1",
    "openpyxl>=3.0.0,<4.0",
    "psycopg2-binary",
]
dev = [
    "duckdb>=1.0",
    "pyarrow>=15",        # scripts/export_site.py writes the site's Parquet slice
    "pytest",
    "ruff==0.13.3",       # keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml
    "pre-commit",
    "jupytext==1.18.1",
    "twine",
]
analysis = [
    "ipykernel",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "seaborn",
    "plotly",
    "nltk",
    "ydata-profiling>=4",
]
airflow = [
    "apache-airflow[postgres,celery,redis]==2.9.1",
]

[tool.uv]
default-groups = ["pipeline", "dev"]
environments = ["python_version >= '3.12'"]

# Airflow 2.9 pins SQLAlchemy 1.4; pandas 2.2+ needs SQLAlchemy 2. They resolve separately.
conflicts = [[{ group = "airflow" }, { group = "pipeline" }]]

# Ruff's classic default rules, spelled out so they don't shift with the ruff version.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gamebot_lite*"]

[tool.setuptools.package-data]
gamebot_lite = ["data/*.sqlite", "data/*.json"]
